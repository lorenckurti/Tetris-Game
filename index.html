<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
  </head>
  <body>
    <div id="tetris-root">
      <aside id="home-sidebar">
        <div class="home-header">
          <div class="home-title">TETRIS</div>
          <div class="home-subtitle">CLASSIC STACK</div>
          <div class="home-divider"></div>
        </div>

        <nav id="home-menu" class="home-menu" aria-label="Game menu">
          <button class="menu-item active" id="drop-in-home-btn"> — SINGLE PLAYER</button>
          <button class="menu-item" id="create-room-home-btn"> — CREATE ROOM</button>
          <button class="menu-item" id="join-room-home-btn"> — JOIN ROOM</button>
          <button class="menu-item" id="customize-home-btn"> — CUSTOMIZE</button>
          <button class="menu-item" id="how-to-play-home-btn"> — HOW TO PLAY</button>
          <button class="menu-item" id="records-home-btn"> — RECORDS</button>
          <button class="menu-item" id="settings-home-btn"> — SETTINGS</button>
        </nav>

        <div class="home-score-box">
          <div class="home-score-label">PERSONAL BEST</div>
          <div class="home-score-value" id="home-score-value">0</div>
        </div>

        <div id="invite-banner" style="display:none">
          <div class="invite-text">You've been invited to room <strong id="invite-code-display">-</strong></div>
          <div class="invite-actions">
            <button id="invite-accept-btn" type="button">JOIN ROOM</button>
            <button id="invite-dismiss-btn" type="button" aria-label="Dismiss invite">✕</button>
          </div>
        </div>
      </aside>

      <div id="multiplayer-panel" style="display:none">
        <div class="mp-header">
          <div class="mp-eyebrow">Battle Royale</div>
          <div class="mp-heading">Lobby</div>
        </div>
        <div id="mp-setup">
          <div class="mp-title" id="mp-setup-title">Create Room</div>
          <input id="mp-name-input" placeholder="Enter your name" maxlength="24" autocomplete="off" />
          <input id="mp-code-input" placeholder="Room code (e.g. XJ4K)" maxlength="16" autocomplete="off" />
          <div id="mp-setup-error" role="alert"></div>
          <button id="mp-setup-go" type="button">CREATE ROOM</button>
        </div>
        <div id="mp-lobby" style="display:none">
          <div class="mp-room-card">
            <div class="mp-room-meta">
              <span class="mp-room-label">Room Code</span>
              <span id="room-id-display">-</span>
            </div>
            <button id="invite-btn" type="button" onclick="copyRoomId()">INVITE</button>
          </div>
          <div class="mp-section">
            <span class="mp-title">Players</span>
            <span id="players-count">0/4</span>
          </div>
          <div id="players-list"></div>
          <div id="waiting-status">Waiting for players...</div>
          <button id="start-btn" type="button">START GAME</button>
          <div class="mp-actions">
            <button id="ready-btn" type="button">READY</button>
            <button id="multiplayer-back-btn" type="button" class="multiplayer-back-btn">BACK</button>
          </div>
        </div>
        <button id="mp-setup-back" type="button" class="multiplayer-back-btn">BACK</button>
      </div>

      <div id="game-area" class="game-stage-hidden">
        <div id="tetris-title">Tetris</div>
        <div id="alive-hud" aria-live="polite">4 ALIVE</div>
        <canvas id="tetris-canvas" width="300" height="600"></canvas>
        <div id="Start-msg">Press Start</div>
        <div id="status" class="status">Ready to play</div>
        <div id="spectator-panel">
          <div class="spec-title">Spectating &mdash; Remaining Players</div>
          <div id="spectator-list"></div>
        </div>
      </div>

      <div id="side-panel" class="game-stage-hidden">
        <div class="panel-box">
          <div class="panel-label">Score</div>
          <div class="panel-value" id="score-val">0</div>
        </div>
        <div class="panel-box">
          <div class="panel-label">Level</div>
          <div class="panel-value" id="level-val">1</div>
        </div>
        <div class="panel-box">
          <div class="panel-label">Lines</div>
          <div class="panel-value" id="lines-val">0</div>
        </div>
        <div class="panel-box next-piece-panel">
          <div class="panel-label">Next Piece</div>
          <div class="panel-value" id="next-piece-val">
            <canvas id="nextCanvas" width="90" height="90" style="width:90px;height:90px"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay"></div>
    <div id="elim-feed" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
